name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Sandbox confinement must hold on both CE targets (CE_DESIGN §2.4).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Phase 1 has no cwva_core dependency, so the suite installs and runs
      # standalone. The Landlock (Layer-2) tests auto-skip where Landlock is
      # unavailable — including all of Windows, whose Layer-2 (dedicated user +
      # NTFS ACLs) is an install-time concern (Phase 11), not an in-process one.
      - name: Full test suite
        run: pytest -q

      - name: Adversarial corpus + properties (explicit gate)
        run: pytest -q -m adversarial
